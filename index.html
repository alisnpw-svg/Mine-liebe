
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="particles"></div>

    <main class="container">

        <div class="top-heart">♥</div>

        <p class="small-title">A SPECIAL DAY FOR SOMEONE SPECIAL</p>

        <h1>Happy Birthday</h1>
<div class="countdown-box">
    <h2>Countdown to Your Special Day ❤️</h2>
    <p id="countdown"></p>
</div>
        <p class="subtitle">
            A little surprise made just for you...
        </p>

        <button id="openButton" onclick="openGift()">
            Open Your Gift ♡
        </button>

        <section id="surprise" class="hidden">

            <div class="photo-frame">
                <img src="our-photo.jpeg" alt="Our beautiful memory">
            </div>

          <div class="love-letter">

    <h2 id="typingText"></h2>

    <h3 id="loveText" class="hidden">
        Ich liebe dich ❤️
    </h3>

</div>

            <p class="ending">Forever and always ♡</p>

            <div class="music-box">
                <h2>Our Special Song 🎵</h2>

               <audio id="loveSong" preload="auto">
    <source src="love-song.mp3" type="audio/mpeg">
</audio>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
